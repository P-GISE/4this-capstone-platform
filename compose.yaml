name: fourthis
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3401:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      DB_URL: jdbc:mariadb://db:3306/fourthis?connectTimeout=5000&socketTimeout=10000
      DB_USERNAME: fourthis
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      UPLOAD_DIR: /app/uploads
      EMAIL_ENABLED: "false"
      AI_ENABLED: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "12", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: fourthis
      MARIADB_USER: fourthis
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - database:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks: [private]
    mem_limit: 384m
    cpus: 0.50
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=30", "--performance-schema=OFF", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 5
volumes:
  database:
  uploads:
networks:
  private:
    internal: true
